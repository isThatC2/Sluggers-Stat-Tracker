name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON_PREFERENCE: only-system

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "latest"

      - name: Build executable
        run: python build.py

      - name: Create zip archive
        shell: bash
        run: |
          archive="sluggers-stat-tracker-${{ matrix.platform }}.zip"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a "$archive" ./dist/*
          else
            cd dist
            zip -r "../$archive" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sluggers-stat-tracker-${{ matrix.platform }}
          path: sluggers-stat-tracker-${{ matrix.platform }}.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Generate release information
        id: release_info
        shell: bash
        run: |
          release_name="$(date +'%Y-%m-%d')-$(git rev-parse --short HEAD)"
          {
            echo "release_name=$release_name"
            echo "release_notes<<EOF"
            cat README.md
            echo
            echo "---"
            echo
            git log -1 --pretty=%B
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release_info.outputs.release_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.release_notes }}
          files: |
            artifacts/sluggers-stat-tracker-windows/sluggers-stat-tracker-windows.zip
            artifacts/sluggers-stat-tracker-linux/sluggers-stat-tracker-linux.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Pages site
        shell: bash
        env:
          RELEASE_NAME: ${{ steps.release_info.outputs.release_name }}
        run: |
          release_name="$RELEASE_NAME"
          repository_url="${{ github.server_url }}/${{ github.repository }}"
          release_url="$repository_url/releases/download/$release_name"
          mkdir -p _pages
          sed \
            -e "s|{{RELEASE_NAME}}|$release_name|g" \
            -e "s|{{WINDOWS_DOWNLOAD_URL}}|$release_url/sluggers-stat-tracker-windows.zip|g" \
            -e "s|{{LINUX_DOWNLOAD_URL}}|$release_url/sluggers-stat-tracker-linux.zip|g" \
            -e "s|{{RELEASES_URL}}|$repository_url/releases|g" \
            index.html > _pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _pages

      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
